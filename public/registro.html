<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GymTrack | Registro</title><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/layout.css"><link rel="stylesheet" href="/css/components.css"></head><body><main class="auth-layout"><section class="auth-art"><div class="logo">Gym<span>Track</span></div><h1>Tu proceso empieza con una cuenta propia.</h1><p>Elige tu rol. Un atleta se vincula después mediante el código de su entrenador.</p></section><section class="auth-panel"><div class="auth-card"><h2>Crear cuenta</h2><div id="message" hidden></div><form id="register"><div class="form-row"><div class="field"><label>Nombre</label><input name="firstName" required minlength="2"></div><div class="field"><label>Apellidos</label><input name="lastName" required minlength="2"></div></div><div class="field"><label>Correo</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>Nueva contraseña</label><input name="password" type="password" minlength="8" autocomplete="new-password" required><small>8 caracteres, una mayúscula y un número.</small></div><div class="field"><label>Confirmar contraseña</label><input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label>Tipo de cuenta</label><select name="role"><option value="athlete">Atleta</option><option value="trainer">Entrenador</option></select></div><button class="btn" type="submit">Crear cuenta</button></form><p><a href="/index.html">Ya tengo una cuenta</a></p></div></section></main><script type="module" src="/js/auth/registro.js"></script></body></html>
