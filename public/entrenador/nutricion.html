<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nutrición</title><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/layout.css"><link rel="stylesheet" href="/css/components.css"></head><body><div class="app-shell"><aside class="sidebar" data-sidebar></aside><main class="page"><header><h1>Planes de nutrición</h1><p class="muted">Metas y comidas sugeridas para cada atleta.</p></header><div id="message" hidden></div><div class="grid two"><form id="nutrition" class="card"><h2>Nuevo plan</h2><div class="field"><label>Atleta</label><select name="athleteId" id="athlete" required></select></div><div class="field"><label>Nombre</label><input name="name" required></div><div class="form-row"><div class="field"><label>Calorías</label><input name="calories" type="number"></div><div class="field"><label>Proteína (g)</label><input name="proteinG" type="number" step=".1"></div></div><div class="form-row"><div class="field"><label>Carbohidratos (g)</label><input name="carbsG" type="number" step=".1"></div><div class="field"><label>Grasas (g)</label><input name="fatsG" type="number" step=".1"></div></div><div class="field"><label>Descripción</label><textarea name="description"></textarea></div><div class="field"><label>Nombre de la comida</label><input name="mealName" value="Plan diario" required></div><div class="field"><label>Alimentos, cantidades y alternativas</label><textarea name="mealDetails" required></textarea></div><button class="btn">Asignar plan</button></form><section><h2>Planes activos</h2><div id="plans" class="list"></div></section></div></main></div><script type="module" src="/js/entrenador/nutricion.js"></script></body></html>
