<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Nueva rutina</title>
  <script src="/js/comun/theme-init.js"></script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>

    <main class="page">
      <header class="page-header">
        <div>
          <h1 id="page-title">Nueva rutina</h1>
          <p class="muted" id="page-description">Crea una rutina inicial de un día; puedes agregar los ejercicios que necesites.</p>
        </div>
        <div class="top-actions">
          <a class="btn secondary" href="rutinas.html">Volver</a>
        </div>
      </header>

      <div id="message" hidden></div>

      <form id="routine" class="card">
        <div class="form-row">
          <div class="field">
            <label for="name">Nombre</label>
            <input id="name" name="name" required>
          </div>
          <div class="field">
            <label for="athlete">Atleta</label>
            <select id="athlete" name="athleteId" required></select>
          </div>
        </div>
        <div class="field">
          <label for="description">Descripción</label>
          <textarea id="description" name="description"></textarea>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="startDate">Fecha inicial</label>
            <input id="startDate" name="startDate" type="date">
          </div>
          <div class="field">
            <label for="dayName">Nombre del día</label>
            <input id="dayName" name="dayName" value="Día 1" required>
          </div>
        </div>

        <h3>Ejercicios</h3>
        <div id="exercise-rows" class="list"></div>

        <div class="actions mt">
          <button class="btn secondary" type="button" id="add">Agregar ejercicio</button>
          <button class="btn" type="submit" id="submit-button">Guardar y activar</button>
        </div>
      </form>
    </main>
  </div>

  <template id="row-template">
    <div class="list-item exercise-row">
      <div class="form-row">
        <div class="field">
          <label>Ejercicio</label>
          <select data-name="exerciseId" required></select>
        </div>
        <div class="field">
          <label>Series</label>
          <input data-name="sets" type="number" min="1" value="3" required>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Repeticiones</label>
          <input data-name="reps" value="8-12" required>
        </div>
        <div class="field">
          <label>Descanso (segundos)</label>
          <input data-name="restSeconds" type="number" min="0" value="90">
        </div>
      </div>
      <button type="button" class="btn danger small remove">Quitar ejercicio</button>
    </div>
  </template>

  <script type="module" src="/js/entrenador/rutina-formulario.js"></script>
</body>

</html>
