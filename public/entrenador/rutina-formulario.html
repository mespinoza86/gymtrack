<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Nueva rutina</title>
  <script src="/js/comun/theme-init.js"></script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>

    <main class="page">
      <header class="page-header">
        <div>
          <h1 id="page-title">Nueva rutina</h1>
          <p class="muted" id="page-description">Arma la semana completa y elige cuánto tiempo se repite.</p>
        </div>
        <div class="top-actions">
          <a class="btn secondary" href="rutinas.html">Volver</a>
        </div>
      </header>

      <div id="message" hidden></div>

      <form id="routine">
        <section class="card">
          <h2>Datos del plan</h2>
          <div class="form-row">
            <div class="field">
              <label for="name">Nombre</label>
              <input id="name" name="name" required>
            </div>
            <div class="field">
              <label for="athlete">Atleta</label>
              <select id="athlete" name="athleteId" required></select>
            </div>
          </div>
          <div class="field">
            <label for="description">Descripción</label>
            <textarea id="description" name="description"></textarea>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="startDate">Fecha inicial</label>
              <input id="startDate" name="startDate" type="date">
            </div>
            <div class="field">
              <label for="weeks">Duración</label>
              <div class="chip-group" id="weeks-options" role="group" aria-label="Duración del plan"></div>
              <input id="weeks" name="weeks" type="number" min="1" max="52" value="1" hidden>
              <small id="weeks-hint">La misma semana se repite durante todo el plan.</small>
            </div>
          </div>
        </section>

        <section class="card mt">
          <h2>La semana</h2>
          <p class="muted">Elige un día para editarlo. Los días libres no necesitan ejercicios.</p>

          <div class="day-tabs" id="day-tabs" role="tablist" aria-label="Días de la semana"></div>

          <div id="day-editor"></div>
        </section>

        <div class="actions mt">
          <button class="btn" type="submit" id="submit-button">Guardar y activar</button>
          <a class="btn secondary" href="rutinas.html">Cancelar</a>
        </div>
      </form>
    </main>
  </div>

  <template id="row-template">
    <div class="list-item exercise-row">
      <div class="exercise-row-head">
        <strong class="exercise-row-title">Ejercicio</strong>
        <button type="button" class="icon-btn danger remove" aria-label="Quitar ejercicio" title="Quitar ejercicio"></button>
      </div>
      <div class="field">
        <select data-name="exerciseId" aria-label="Ejercicio" required></select>
      </div>
      <div class="form-row compact">
        <div class="field">
          <label>Series</label>
          <input data-name="sets" type="number" min="1" max="20" value="3" required>
        </div>
        <div class="field">
          <label>Reps</label>
          <input data-name="reps" value="8-12" required>
        </div>
        <div class="field">
          <label>Descanso (s)</label>
          <input data-name="restSeconds" type="number" min="0" max="3600" value="90">
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="/js/entrenador/rutina-formulario.js"></script>
</body>

</html>
