<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Invitaciones</title>
  <script src="/js/comun/theme-init.js"></script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>

    <main class="page">
      <header class="page-header">
        <div>
          <h1>Invitaciones</h1>
          <p class="muted">Cada código dura siete días y solo puede utilizarse una vez.</p>
        </div>
        <div class="top-actions">
          <button class="btn" id="create">Generar código</button>
        </div>
      </header>

      <div id="message" hidden></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Estado</th>
              <th>Vence</th>
              <th>Creado</th>
            </tr>
          </thead>
          <tbody id="invitations"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="/js/entrenador/invitaciones.js"></script>
</body>

</html>
