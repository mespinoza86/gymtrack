<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Check-in semanal</title>
  <script src="/js/comun/theme-init.js"></script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>

    <main class="page">
      <header class="page-header">
        <div>
          <h1>Check-in semanal</h1>
          <p class="muted">Cuéntale a tu entrenador cómo estuvo realmente la semana.</p>
        </div>
      </header>

      <div id="message" hidden></div>

      <div class="grid two">
        <form id="checkin" class="card">
          <h2>Nuevo check-in</h2>
          <div class="field">
            <label for="trainer">Entrenador</label>
            <select id="trainer" name="trainerId" required></select>
          </div>
          <div class="field">
            <label for="checkinDate">Fecha</label>
            <input id="checkinDate" name="checkinDate" type="date" required>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="energy">Energía (1–10)</label>
              <input id="energy" name="energy" type="number" min="1" max="10" required>
            </div>
            <div class="field">
              <label for="sleepHours">Sueño (horas)</label>
              <input id="sleepHours" name="sleepHours" type="number" min="0" max="24" step=".5" required>
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="stress">Estrés (1–10)</label>
              <input id="stress" name="stress" type="number" min="1" max="10" required>
            </div>
            <div class="field">
              <label for="hunger">Hambre (1–10)</label>
              <input id="hunger" name="hunger" type="number" min="1" max="10" required>
            </div>
          </div>
          <div class="field">
            <label for="adherence">Adherencia al plan (%)</label>
            <input id="adherence" name="adherence" type="number" min="0" max="100" required>
          </div>
          <div class="field">
            <label for="wins">Logros</label>
            <textarea id="wins" name="wins"></textarea>
          </div>
          <div class="field">
            <label for="difficulties">Dificultades</label>
            <textarea id="difficulties" name="difficulties"></textarea>
          </div>
          <div class="field">
            <label for="painDetails">Dolor o molestias</label>
            <textarea id="painDetails" name="painDetails"></textarea>
          </div>
          <button class="btn">Enviar check-in</button>
        </form>

        <section>
          <h2>Anteriores</h2>
          <div id="checkins" class="list"></div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="/js/atleta/checkin.js"></script>
</body>

</html>
