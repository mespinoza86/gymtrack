<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-in semanal</title><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/layout.css"><link rel="stylesheet" href="/css/components.css"></head><body><div class="app-shell"><aside class="sidebar" data-sidebar></aside><main class="page"><header><h1>Check-in semanal</h1><p class="muted">Cuéntale a tu entrenador cómo estuvo realmente la semana.</p></header><div id="message" hidden></div><div class="grid two"><form id="checkin" class="card"><div class="field"><label>Entrenador</label><select name="trainerId" id="trainer" required></select></div><div class="field"><label>Fecha</label><input name="checkinDate" type="date" required></div><div class="form-row"><div class="field"><label>Energía (1–10)</label><input name="energy" type="number" min="1" max="10" required></div><div class="field"><label>Sueño (horas)</label><input name="sleepHours" type="number" min="0" max="24" step=".5" required></div></div><div class="form-row"><div class="field"><label>Estrés (1–10)</label><input name="stress" type="number" min="1" max="10" required></div><div class="field"><label>Hambre (1–10)</label><input name="hunger" type="number" min="1" max="10" required></div></div><div class="field"><label>Adherencia al plan (%)</label><input name="adherence" type="number" min="0" max="100" required></div><div class="field"><label>Logros</label><textarea name="wins"></textarea></div><div class="field"><label>Dificultades</label><textarea name="difficulties"></textarea></div><div class="field"><label>Dolor o molestias</label><textarea name="painDetails"></textarea></div><button class="btn">Enviar check-in</button></form><section><h2>Anteriores</h2><div id="checkins" class="list"></div></section></div></main></div><script type="module" src="/js/atleta/checkin.js"></script></body></html>
