<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi progreso</title><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/layout.css"><link rel="stylesheet" href="/css/components.css"></head><body><div class="app-shell"><aside class="sidebar" data-sidebar></aside><main class="page"><header><h1>Mi progreso</h1><p class="muted">Registra medidas en condiciones similares para comparar mejor.</p></header><div id="message" hidden></div><div class="grid two"><form id="measurement" class="card"><h2>Nueva medición</h2><div class="field"><label>Fecha</label><input name="measuredAt" type="date" required></div><div class="form-row"><div class="field"><label>Peso (kg)</label><input name="weightKg" type="number" min="1" step=".1"></div><div class="field"><label>Grasa corporal (%)</label><input name="bodyFatPercent" type="number" min="0" max="100" step=".1"></div></div><div class="form-row"><div class="field"><label>Cintura (cm)</label><input name="waistCm" type="number" step=".1"></div><div class="field"><label>Cadera (cm)</label><input name="hipCm" type="number" step=".1"></div></div><div class="form-row"><div class="field"><label>Pecho (cm)</label><input name="chestCm" type="number" step=".1"></div><div class="field"><label>Brazo (cm)</label><input name="armCm" type="number" step=".1"></div></div><div class="field"><label>Notas</label><textarea name="notes"></textarea></div><button class="btn">Guardar medición</button></form><section><h2>Historial</h2><div id="measurements" class="list"></div></section></div></main></div><script type="module" src="/js/atleta/progreso.js"></script></body></html>
