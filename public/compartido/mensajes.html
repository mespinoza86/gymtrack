<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Mensajes</title>
  <script src="/js/comun/theme-init.js"></script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>

    <main class="page">
      <header class="page-header">
        <div>
          <h1>Mensajes</h1>
          <p class="muted">Comunicación directa entre entrenador y atleta.</p>
        </div>
      </header>

      <div id="message" hidden></div>

      <div class="grid messages">
        <section class="card">
          <h3>Conversaciones</h3>
          <div id="conversations" class="list"></div>
        </section>

        <section class="card">
          <div id="chat" class="chat">
            <div class="empty">Selecciona una conversación para comenzar.</div>
          </div>
          <form id="send" class="chat-form">
            <div class="field">
              <label class="sr-only" for="body">Mensaje</label>
              <input id="body" name="body" placeholder="Escribe un mensaje..." maxlength="4000" autocomplete="off" required>
            </div>
            <button class="btn">Enviar</button>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/compartido/mensajes.js"></script>
</body>

</html>
