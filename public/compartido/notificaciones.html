<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Notificaciones</title>
  <script src="/js/comun/theme-init.js"></script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>

    <main class="page">
      <header class="page-header">
        <div>
          <h1>Notificaciones</h1>
          <p class="muted">Novedades de tus rutinas, seguimiento y conversaciones.</p>
        </div>
        <div class="top-actions">
          <button class="btn secondary" id="read-all" type="button">Marcar todas como leídas</button>
        </div>
      </header>

      <div id="message" hidden></div>
      <section id="notifications" class="notification-list" aria-live="polite">
        <div class="skeleton skeleton-card"></div>
      </section>
    </main>
  </div>

  <script type="module" src="/js/compartido/notificaciones.js"></script>
</body>

</html>
