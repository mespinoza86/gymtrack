<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi perfil</title><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/layout.css"><link rel="stylesheet" href="/css/components.css"></head><body><div class="app-shell"><aside class="sidebar" data-sidebar></aside><main class="page"><header><h1>Mi perfil</h1><p class="muted">Información personal y vinculaciones.</p></header><div id="message" hidden></div><div class="grid two"><form id="profile" class="card"><h2>Datos personales</h2><div class="form-row"><div class="field"><label>Nombre</label><input name="firstName" required></div><div class="field"><label>Apellidos</label><input name="lastName" required></div></div><div class="field"><label>Correo</label><input name="email" disabled></div><div class="field"><label>Teléfono</label><input name="phone"></div><div class="field"><label>Fecha de nacimiento</label><input name="birthDate" type="date"></div><button class="btn">Guardar cambios</button></form><section><div class="card" id="invite-box"><h2>Vincular entrenador</h2><p>Introduce el código de invitación que te compartió.</p><form id="accept"><div class="field"><label>Código</label><input name="code" maxlength="20" required></div><button class="btn">Aceptar invitación</button></form></div><div class="card" style="margin-top:18px"><h2>Vinculaciones activas</h2><div id="people" class="list"></div></div></section></div></main></div><script type="module" src="/js/compartido/perfil.js"></script></body></html>
