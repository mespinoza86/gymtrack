<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Mi perfil</title>
  <script src="/js/comun/theme-init.js"></script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>

    <main class="page">
      <header class="page-header">
        <div>
          <h1>Mi perfil</h1>
          <p class="muted">Información personal, seguridad y vinculaciones.</p>
        </div>
      </header>

      <div id="message" hidden></div>

      <div class="grid two">
        <section>
          <form id="profile" class="card">
            <h2>Datos personales</h2>
            <div class="form-row">
              <div class="field">
                <label for="firstName">Nombre</label>
                <input id="firstName" name="firstName" required autocomplete="given-name">
              </div>
              <div class="field">
                <label for="lastName">Apellidos</label>
                <input id="lastName" name="lastName" required autocomplete="family-name">
              </div>
            </div>
            <div class="field">
              <label for="email">Correo</label>
              <input id="email" name="email" disabled>
              <small>El correo de acceso no se puede modificar.</small>
            </div>
            <div class="field">
              <label for="phone">Teléfono</label>
              <input id="phone" name="phone" autocomplete="tel">
            </div>
            <div class="field">
              <label for="birthDate">Fecha de nacimiento</label>
              <input id="birthDate" name="birthDate" type="date">
            </div>
            <button class="btn">Guardar cambios</button>
          </form>

          <form id="change-password" class="card mt">
            <h2>Cambiar contraseña</h2>
            <div class="field">
              <label for="currentPassword">Contraseña actual</label>
              <input id="currentPassword" name="currentPassword" type="password" maxlength="72" autocomplete="current-password" required>
            </div>
            <div class="field">
              <label for="newPassword">Nueva contraseña</label>
              <input id="newPassword" name="newPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
              <small>Mínimo 8 caracteres, una mayúscula y un número.</small>
            </div>
            <div class="field">
              <label for="confirmPassword">Confirmar nueva contraseña</label>
              <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
            </div>
            <button class="btn">Cambiar contraseña</button>
          </form>
        </section>

        <section>
          <div class="card" id="invite-box">
            <h2>Vincular entrenador</h2>
            <p class="muted">Introduce el código de invitación que te compartió.</p>
            <form id="accept">
              <div class="field">
                <label for="code">Código</label>
                <input id="code" name="code" maxlength="20" required placeholder="Por ejemplo: A1B2C3D4E5">
              </div>
              <button class="btn">Aceptar invitación</button>
            </form>
          </div>

          <div class="card mt">
            <h2>Vinculaciones activas</h2>
            <div id="people" class="list"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="/js/compartido/perfil.js"></script>
</body>

</html>
